[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "guardenv"
version = "1.1.0"
description = "High-speed detection of leaked credentials, tokens and private keys in source trees."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GuardEnv Contributors" }]
keywords = [
    "security",
    "secrets",
    "devsecops",
    "static-analysis",
    "entropy",
    "sarif",
    "pre-commit",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/cperez233/guardenv"
Repository = "https://github.com/cperez233/guardenv"
Issues = "https://github.com/cperez233/guardenv/issues"
Changelog = "https://github.com/cperez233/guardenv/blob/main/CHANGELOG.md"

[project.scripts]
guardenv = "guardenv.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["guardenv"]

[tool.hatch.build.targets.sdist]
include = ["guardenv", "tests", "README.md", "LICENSE"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["web", ".venv"]

[tool.ruff.format]
# Ruff formats fenced Python blocks inside Markdown. The snippets in the docs are
# deliberate fragments (a single `_rule(...)` entry, not a statement), so leave
# prose files alone.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PL"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # `typer.Option(...)` in a default is the documented Typer idiom
    "PLR0911", # detectors are decision tables; early returns read better than nesting
    "PLR0912", # ditto for branch counts
    "PLR0913", # CLI entry points legitimately take many options
    "PLR0917", # ditto for positional argument counts
    "PLR2004", # magic numbers are fine inside heuristics
    "RUF001",  # box-drawing characters in banners are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "PLC0415"]
"guardenv/rules.py" = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["guardenv"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["guardenv"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["guardenv"]
