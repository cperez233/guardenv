# Hooks GuardEnv runs on itself.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: guardenv
        name: GuardEnv secret scan
        entry: guardenv scan
        args:
          - "--no-banner"
          - "--fail-on"
          - "MEDIUM"
          # Paths holding deliberately synthetic credentials.
          - "--exclude"
          - "examples/*"
          - "--exclude"
          - "tests/*"
          - "--exclude"
          - "web/src/lib/samples.ts"
          - "--exclude"
          - "web/src/engine/engine.test.ts"
          - "--exclude"
          - "scripts/benchmark.py"
        language: system
        types: [text]
        pass_filenames: true
